<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Path Submission Form - Secure OAuth</title>
    <link rel="stylesheet" href="style-oauth.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Submit a Learning Path</h1>
            <p class="subtitle">Share your learning path with the community</p>
            
            <!-- Authentication Section -->
            <div id="authSection" class="auth-section">
                <div id="loginBtn" class="login-container">
                    <p>Please authenticate with GitHub to submit a learning path</p>
                    <button class="github-login-btn">
                        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                        Sign in with GitHub
                    </button>
                </div>

                <div id="userProfile" class="user-profile hidden">
                    <div class="profile-info">
                        <img id="userAvatar" class="avatar" alt="User Avatar">
                        <span id="userName" class="username"></span>
                    </div>
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </div>

            <!-- Form Section (Hidden until authenticated) -->
            <form id="learningPathForm" style="display: none;">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="surname">Surname *</label>
                    <input type="text" id="surname" name="surname" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="title">Title of Learning Path *</label>
                    <input type="text" id="title" name="title" placeholder="e.g., Web Development Fundamentals" required>
                </div>

                <div class="form-group">
                    <label for="summary">Summary of Learning Path *</label>
                    <textarea id="summary" name="summary" rows="6" placeholder="Describe your learning path..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>

            <div id="successMessage" class="success-message hidden">
                <p>✓ Learning path submitted successfully! An issue has been created.</p>
            </div>

            <div id="errorMessage" class="error-message hidden">
                <p id="errorText"></p>
            </div>
        </div>
    </div>

    <script src="script-oauth.js"></script>
</body>
</html>
